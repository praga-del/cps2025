<head>

<title>Chemical Process Safety Quiz</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2333;--muted:#6b7488;--accent:#2457d6;--ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdeaea;--line:#dfe3ec}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
.wrap{width:100%;max-width:780px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header h1{font-size:18px;margin:0}
header span{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 14px rgba(20,30,60,.08);padding:26px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;gap:6px}
.q{font-size:19px;line-height:1.45;font-weight:600;margin:0 0 20px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;font-size:16px;color:var(--ink);cursor:pointer;font-family:inherit;transition:.15s}
.opt:hover{border-color:var(--accent);background:#f6f9ff}
.opt b{min-width:24px;height:24px;border-radius:50%;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.opt.wrong{border-color:var(--bad);background:var(--badbg);cursor:default}
.opt.wrong b{background:var(--bad);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right b{background:var(--ok);color:#fff}
.msg{min-height:22px;font-size:14px;margin-top:4px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px 20px;font-size:15px;cursor:pointer;font-family:inherit}
button.btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
button.btn:hover{opacity:.9}
select{padding:10px;border-radius:9px;border:2px solid var(--line);font-size:15px;font-family:inherit}
h2{margin:0 0 8px}
p.sub{color:var(--muted);margin:0 0 18px;line-height:1.5}
.score{font-size:46px;font-weight:700;color:var(--accent);margin:6px 0}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.wk{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;transition:.15s}
.wk:hover{border-color:var(--accent);background:#f6f9ff;transform:translateY(-2px)}
.wk strong{font-size:17px}.wk small{color:var(--muted)}.wk em{font-style:normal;font-size:13px;color:var(--accent);margin-top:4px}
@media(max-width:520px){.card{padding:18px}.q{font-size:17px}}
</style>
</head>

let curSel='all';
function getBest(){try{return JSON.parse(localStorage.getItem('ncp_best')||'{}')}catch(e){return {}}}
function setBest(w,s){try{const b=getBest();if(b[w]===undefined||s>b[w]){b[w]=s;localStorage.setItem('ncp_best',JSON.stringify(b));}}catch(e){}}
function start(sel){curSel=sel;buildList(sel);idx=0;firstTry=new Array(list.length).fill(null);show();}
function home(){
  const best=getBest();
  let grid='';
  W.forEach((_,i)=>{
    const b=best[i]!==undefined?`Best: ${best[i]}/10`:'Not attempted';
    grid+=`<button class="wk" data-w="${i}"><strong>Week ${i+1}</strong><small>10 questions</small><em>${b}</em></button>`;
  });
  app.innerHTML=`<h2>Computer-Based Assessment</h2>
  <p class="sub">Chemical Process Safety &ndash; choose a week to begin.<br>Click the correct option to move to the next question. A wrong click turns red and you can try again &ndash; only your first attempt counts for the score.</p>
  <div class="grid">${grid}</div>
  <div class="row"><button class="btn" id="all">Take all 12 weeks (120 questions)</button></div>`;
  document.querySelectorAll('.wk').forEach(b=>b.onclick=()=>start(b.dataset.w));
  document.getElementById('all').onclick=()=>start('all');
}
function show(){
  const it=list[idx];answered=false;
  const pct=(idx/list.length*100).toFixed(1);
  app.innerHTML=`<div class="bar"><i style="width:${pct}%"></i></div>
  <div class="meta"><span>Week ${it.w+1} &middot; Question ${it.n}/10</span><span>Overall ${idx+1} / ${list.length}</span></div>
  <p class="q">${esc(it.q)}</p>
  <div id="opts">${it.o.map((t,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${esc(t)}</span></button>`).join('')}</div>
  <div class="msg" id="msg"></div>
  <div class="row"><button class="btn ghost" id="prev" ${idx===0?'disabled':''}>&larr; Back</button><button class="btn ghost" id="skip">Skip &rarr;</button><button class="btn ghost" id="quit" style="margin-left:auto">Quit</button></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));
  document.getElementById('prev').onclick=()=>{if(idx>0){idx--;show();}};
  document.getElementById('skip').onclick=next;
  document.getElementById('quit').onclick=()=>{if(confirm('Quit and see results so far?'))finish();};
}
function pick(b){
  if(answered||b.classList.contains('wrong'))return;
  const it=list[idx],i=+b.dataset.i,msg=document.getElementById('msg');
  if(i===it.a){
    answered=true;
    if(firstTry[idx]===null)firstTry[idx]=true;
    b.classList.add('right');msg.className='msg ok';msg.textContent='Correct!';
    setTimeout(next,650);
  }else{
    if(firstTry[idx]===null)firstTry[idx]=false;
    b.classList.add('wrong');msg.className='msg bad';msg.textContent='Incorrect – try another option.';
  }
}
function next(){ if(idx<list.length-1){idx++;show();}else finish(); }
function finish(){
  const total=list.length;
  let correct=firstTry.filter(x=>x===true).length;
  const per={};
  list.forEach((it,i)=>{const k=it.w;per[k]=per[k]||{c:0,t:0,u:0};per[k].t++;if(firstTry[i]===true)per[k].c++;if(firstTry[i]===null)per[k].u++;});
  let rows='';Object.keys(per).forEach(k=>rows+=`<tr><td>Week ${+k+1}</td><td>${per[k].c} / ${per[k].t}</td><td>${per[k].u} unattempted</td></tr>`);
  app.innerHTML=`<h2>Quiz Complete</h2><div class="score">${correct} / ${total}</div>
  <p class="sub">First-attempt score: ${(correct/total*100).toFixed(1)}%</p>
  <table><tr><th>Week</th><th>Score</th><th></th></tr>${rows}</table>
  <div class="row">${curSel!=='all'&&+curSel<11?'<button class="btn" id="nw">Next Week &rarr;</button>':''}<button class="btn ghost" id="retry">Retry</button><button class="btn ghost" id="menu">All Weeks</button></div>`;
  if(curSel!=='all')setBest(curSel,correct);
  else Object.keys(per).forEach(k=>setBest(k,per[k].c));
  const nw=document.getElementById('nw');if(nw)nw.onclick=()=>start(String(+curSel+1));
  document.getElementById('retry').onclick=()=>start(curSel);
  document.getElementById('menu').onclick=home;
}
home();
</script>
</body>
</html>
